name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_call:

jobs:
    js:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm validate
            - run: pnpm typecheck
            - run: pnpm build
            - name: Plural fixtures are up to date
              run: |
                  pnpm generate:fixtures
                  git diff --exit-code Tests/PelagicaI18nTests/Fixtures/

    swift:
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v5
            - run: swift test
